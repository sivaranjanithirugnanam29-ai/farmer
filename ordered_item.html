{%include 'user_header.html'%}
{% load mathfilters %}

<html>
<head>
<style>
table {
	font-family: times new roman;
	border-collapse: collapse;
	width: 100%;
}
td, th{
	border: 1px solid #dddddd;
	text-align: center;
	padding: 8px;
	}
</style>
</head>
<body>
<div class="container">
    <h1 style="padding-top: 20px;"><center><i>View Booking</i></center></h1>
</div>
<table class="table table-bordered">
	<tr>
		<th>s.no</th>
		<th>Service Name</th>
		<th>Date</th>
		<th>Time</th>
		<th>Total Member</th>
		<th>Status</th>
	</tr>
{% for i in order %}
	<tr>
		<td>{{forloop.counter}}</td>
		<td>{{i.service_name}}</td>
		<td>{{i.date}}</td>
		<td>{{i.time}}</td>
		<td>{{i.tot_member}}</td>
		<td><a href="{% url 'view_items_cart_product' pk=i.id %}" class="btn btn-primary"><i class="fa fa-eye"></i> Items</a> </td>
	</tr>
{% empty %}
	<tr>
		<td>no data</td>
	</tr>
	{% endfor %}
</table>

</body>
</html>
{%include 'footer.html'%}
