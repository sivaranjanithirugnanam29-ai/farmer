{%include 'user_header.html'%}

<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12" style="padding-top: 50px;">
    <div class="card" >
        <h5 class="card-header">Farmer Details</h5>
        <div class="card-body">
        <div class="row">
		{% for i in b %}
		<div class="col-md-6" style="text-align: center;">
			<h4>Farmer Name: {{i.name}}</h4>
			<p>Mobile: {{i.mobile}}</p>
			<h4>Address</h4>
			<p>{{i.address}}</p>
			<a href="{% url 'veg_product' %}?fid={{i.id}}" class="btn btn-info btn-lg" style="margin-bottom: 30px;background-color:#ff407b;border-color:#ff407b; ">Buy Product</a>

		</div>
		{% endfor %}
	</div>
  </div>
   </div>
    </div>

{%include 'user_footer.html'%}
